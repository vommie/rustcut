edge_right = { tabler = "border-right", doc = "Right edge" }
edge_bottom = { tabler = "border-bottom", doc = "Bottom edge" }
edge_left = { tabler = "border-left", doc = "Left edge" }
rotate_left = { tabler = "rotate", doc = "Rotate a quarter counter-clockwise" }
rotate_right = { tabler = "rotate-clockwise", doc = "Rotate a quarter clockwise" }
