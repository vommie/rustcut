# RustCut icon manifest - the single source of truth for every icon in the application (same scheme as RustView's).
#
# `build.rs` (see `build/icon_registry.rs`) validates this file against the SVG files on disk and generates
#   * `icon_registry.slint` -> Slint enum `IconId` + `IconRegistry` lookup (used by `AppIcon` in `ui/icons.slint`)
#   * `icon_registry.rs`    -> Rust enum `crate::icons::Icon` incl. metadata, name lookup and Slint conversion
# so Rust and Slint never drift apart. To add an icon: add ONE line below, copy the SVG with
# `icon copy tabler <name> crates/rustcut/assets/icons/tabler/outline` (original file name), then use `Icon::<PascalCase>`
# in Rust or `IconId.<kebab-case>` in Slint.
#
# Entry format (key = icon id in snake_case):
#   tabler = "<name>"    Tabler icon file name WITHOUT extension (file names are never renamed).
#   style  = "outline"   Tabler variant: "outline" (default) or "filled".
#   custom = "<file>"    Non-Tabler SVG below `assets/icons/custom/`.
#   color  = true        Icon keeps its own colors and is never tinted (default: false = monochrome).
#   doc    = "..."       Short description (shown in the generated API docs).
#   aliases = [...]      Additional names accepted by `Icon::from_name`.

[library]
tabler_version = "3.49.0"

[icons]
