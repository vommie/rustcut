[package]
name = "rustcut"
description = "Local video cutter: mark sections, apply filters, render through a queue, tag and rate in RustView"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
publish.workspace = true
build = "build.rs"

[lib]
name = "rustcut"
path = "src/lib.rs"

[[bin]]
name = "rustcut"
path = "src/main.rs"

[lints]
workspace = true

[features]
# Slint's embedded MCP server for development and debugging: started with `SLINT_MCP_PORT=<port>`, it answers on
# http://127.0.0.1:<port>/mcp (element tree, properties, screenshots, clicks, drags; `scripts/mcp.py`, CLAUDE.md). Without
# the variable nothing listens. Release packages (P5) build with `--no-default-features`.
default = ["slint-mcp"]
slint-mcp = ["slint/mcp"]

[dependencies]
az.workspace = true
rustcut-core.workspace = true
rustcut-player.workspace = true
slint.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
parking_lot.workspace = true
humansize.workspace = true
chrono.workspace = true
opener.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tracing-appender.workspace = true
rfd.workspace = true
interprocess.workspace = true
fnv.workspace = true
directories.workspace = true
regex.workspace = true

[build-dependencies]
slint-build.workspace = true
# The icon manifest (assets/icons/icons.toml) is read by build/icon_registry.rs.
toml.workspace = true

[dev-dependencies]
proptest.workspace = true
similar.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
