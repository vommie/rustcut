[package]
name = "rustcut-core"
description = "RustCut without a user interface: domain model, editing, rendering, queue, store, settings, RustView client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
which.workspace = true
atomic-write-file.workspace = true
az.workspace = true
backon.workspace = true
chrono.workspace = true
directories.workspace = true
hex.workspace = true
ioprio.workspace = true
humansize.workspace = true
isolang.workspace = true
md-5.workspace = true
minijinja.workspace = true
parking_lot.workspace = true
path-clean.workspace = true
procfs.workspace = true
quick_cache.workspace = true
regex.workspace = true
rusqlite.workspace = true
rusqlite_migration.workspace = true
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_with.workspace = true
shlex.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true

[dev-dependencies]
criterion.workspace = true
insta.workspace = true
proptest.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

# cargo-machete matches crate names: the `md-5` package is used as `md5`.
[package.metadata.cargo-machete]
ignored = ["md-5"]

[[bench]]
name = "render"
harness = false

[[bench]]
name = "hashing"
harness = false

[[bench]]
name = "queue_store"
harness = false
