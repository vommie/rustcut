[workspace]
resolver = "3"
members = ["crates/rustcut-core", "crates/rustcut-player", "crates/rustcut"]
default-members = ["crates/rustcut-core", "crates/rustcut-player", "crates/rustcut"]

[workspace.package]
# Single source of truth for the app version: the About page, the package script and the PKGBUILD read it from here.
# Claude bumps the patch number whenever a state is testable; major and minor belong to the user.
version = "0.0.81"
edition = "2024"
# The lowest toolchain known to work (rusqlite_migration needs 1.95). rust-toolchain.toml pins `stable`.
rust-version = "1.95"
license = "MIT"
authors = ["vommie"]
repository = "https://github.com/vommie/rustcut"
homepage = "https://github.com/vommie/rustcut"
readme = "README.md"
keywords = ["video", "cutter", "ffmpeg", "mpv", "slint"]
categories = ["multimedia::video", "gui"]
# Applications, never published to crates.io.
publish = false

# Every dependency version lives here; the crates reference them with `workspace = true`.
[workspace.dependencies]
# Benchmarks (M6.3): statistics-driven micro-benchmarks with HTML reports.
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support", "plotters", "html_reports"] }
rustcut-core = { path = "crates/rustcut-core" }
# Where a program named without a path is found in PATH (Settings rows of programs, 0.0.67).
which = "8"
# Packs the log files of earlier days (.log.gz, 0.0.67).
flate2 = "1"
rustcut-player = { path = "crates/rustcut-player" }

slint = { version = "1.18", features = ["raw-window-handle-06", "unstable-winit-030"] }
slint-build = "1.18"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Numeric conversions that say what happens on overflow (saturate, check) instead of the silent truncation of `as`.
az = "1"
# File-name templates (Jinja2 syntax) with a fuel limit; RustStart uses the same engine.
minijinja = { version = "3", features = ["builtins", "serde", "fuel"] }
# The Tag & Rate panel's regular-expression tag filter (RustView uses the same crate).
regex = "1"
# Line diffs in the RustView parity test (tests/rustview_parity.rs).
# Async runtime of the services (actors, processes, timers); the UI thread never runs on it (ADR-4).
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "signal", "io-util", "net", "process", "fs"] }
parking_lot = "0.12"
# Queue, job history and job logs (ADR-5). `backup` copies the database before a migration.
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
rusqlite_migration = "2"
toml = "1"
# Settings and UI state are written to a temporary file and renamed, so a crash never leaves half a file.
atomic-write-file = "0.3"
# XDG config, data and state folders.
directories = "6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
# Lexical path normalization (`a/./b/../c` -> `a/c`) without touching the drive.
path-clean = "1"
# libmpv bindings (LGPL-2.1, linked dynamically like RustView); the default `render` feature brings the render API that draws
# into an OpenGL framebuffer (ADR-2).
libmpv2 = "6"
# The raw libmpv functions libmpv2 does not wrap (`mpv_request_log_messages`), used in one documented `unsafe` block.
libmpv2-sys = "4"
# OpenGL bindings for the player's framebuffer texture on Slint's context.
glow = "0.18"
# Keeps the mpv handle and the render context that borrows it in one struct (no hand-written self-referential unsafe code).
self_cell = "1"
# Latency histograms for the player's frame-time statistics (mean, percentiles, maximum).
hdrhistogram = { version = "7", default-features = false }
# Daily rotating log files in the state folder, written by a background thread (never blocks the UI thread).
tracing-appender = "0.2"
# File > Open: the desktop's file dialog through the XDG portal (KDE's dialog on Plasma), Wayland-ready.
rfd = "0.17"
# Single instance: a local socket in $XDG_RUNTIME_DIR that a second start forwards its files through (RustStart uses it too).
interprocess = { version = "2", features = ["tokio"] }
# A stable hash (FNV-1a) of the profile folder in the socket name, so separate profiles never reach each other.
fnv = "1"

# Tolerant decoding of ffprobe's JSON: numbers that come as strings, and one broken field becomes `None` instead of failing the
# whole probe (the `ffprobe`/`easy-ffprobe` crates require fields that some files and ffprobe versions leave out).
serde_with = { version = "3", default-features = false, features = ["macros", "std"] }
# MD5 of a source for RustView's known-source check (RustCrypto).
md-5 = "0.11"
# Lowercase hex of digests (RustView stores MD5s as 32 lowercase hex digits).
hex = "0.4"
# File sizes in the Media Info panel ("10.34 MB").
humansize = "2"
opener = { version = "0.9", features = ["reveal"] }
# The clipboard (Copy in the Logs panel): X11 and Wayland's data-control protocol; Slint's winit backend uses it too.
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control"] }
# D-Bus for logind (sleep inhibitor, suspend, power off) and the taskbar progress (Unity LauncherEntry); the version
# rfd's portal already uses.
zbus = { version = "5", default-features = false, features = ["tokio"] }
notify-rust = "4"
# Language names of audio and subtitle tracks from their ISO 639 codes ("deu" -> "German").
isolang = "2"

# Process control of the ffmpeg renders: signals to the process group (pause = SIGSTOP/SIGCONT, cancel), niceness, and the
# no-replace rename that puts a verified render onto its target without ever clobbering a file that appeared meanwhile;
# `posix_fadvise` and the thread id for the hash reads (read-ahead advice, drive priority of the reading thread).
rustix = { version = "1", features = ["process", "fs", "thread"] }
# The idle I/O class for the renders (`ioprio_set` on the process group), so the desktop stays responsive.
ioprio = "0.2"
# Finding the ffmpeg runs a crashed RustCut left behind (`/proc`: owner, process group, parent, arguments) at start.
procfs = { version = "0.18", default-features = false }
# X11 dialog hints (`WM_TRANSIENT_FOR`, dialog type) for windows that belong to another window (the color picker); the
# version winit uses.
x11rb = "0.13"
# The X11 window id behind a Slint window (the version Slint's `raw-window-handle-06` feature hands out).
raw-window-handle = "0.6"
# Shell quoting of the ffmpeg command line in the job log (copy and paste it into a terminal to reproduce a render).
shlex = "2"
# The growing pause between attempts while RustView cannot be reached (exponential, capped), used as a plain iterator of
# delays by the sync actor.
backon = { version = "1", default-features = false, features = ["std"] }

# The previews of media files (pictures and descriptions): a concurrent cache weighed in bytes whose loads for the same
# key are shared (`get_value_or_guard_async`).
quick_cache = "0.7"

# Folder pictures (P11.2): own images scaled down (Lanczos3) and stored as lossy WebP with alpha (libwebp), own SVGs
# sanitized by usvg and checked by resvg (the versions Slint already uses), the BLAKE3 hash names a stored picture.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico", "qoi"] }
webp = { version = "0.3", default-features = false }
usvg = { version = "0.48", default-features = false, features = ["writer"] }
resvg = { version = "0.48", default-features = false }
blake3 = "1"

# Tests only.
proptest = "1"
insta = "1"
tempfile = "3"

# Lints. The rust and clippy groups below are the project's definition of "safe and robust"; `scripts/check-all.sh` and
# `cargo cl` turn every warning into an error. Generated Slint code and tests are exempt where noted (clippy.toml, `mod generated`).
[workspace.lints.rust]
# Only `rustcut-player` may contain unsafe code (libmpv and OpenGL), in the modules that talk to FFI, each allowing it with a reason.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
non_ascii_idents = "forbid"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_lifetimes = "warn"
unused_import_braces = "warn"
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
# Everything clippy calls pedantic, minus the lints that only ask for documentation or taste (allowed below with a reason).
pedantic = { level = "warn", priority = -1 }
# A panic in an actor or worker task silently stops it, so panicking constructs are not accepted outside tests.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
dbg_macro = "warn"
# Out-of-range indexing and slicing in the middle of a UTF-8 character panic.
indexing_slicing = "warn"
string_slice = "warn"
# `Instant - Duration` panics when the result would be before the clock's start.
unchecked_time_subtraction = "warn"
# Silent truncation and wrap-around of numbers (timestamps, sizes, frame counts).
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
cast_lossless = "warn"
# Unsafe code must say why it is sound (player crate only); locks must not be held longer than needed (deadlocks).
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "warn"
significant_drop_in_scrutinee = "warn"
await_holding_lock = "warn"
mem_forget = "warn"
exit = "warn"
rc_mutex = "warn"
map_err_ignore = "warn"
lossy_float_literal = "warn"
fallible_impl_from = "warn"
maybe_infinite_iter = "warn"
redundant_clone = "warn"
# Documentation and taste, not safety. Both crates are applications that are never published, so there is no consumer of a
# public API that `#[must_use]` attributes and `# Errors` / `# Panics` sections would guide.
must_use_candidate = "allow"
return_self_not_must_use = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"       # settings structs mirror one switch per UI control
fn_params_excessive_bools = "allow"
similar_names = "allow"                # tx/rx, in/out pairs read well in their functions
many_single_char_names = "allow"
doc_markdown = "allow"
too_long_first_doc_paragraph = "allow"
needless_pass_by_value = "allow"       # Slint callbacks and Rc handles hand over ownership by design
assert_is_empty = "allow"              # tests: `assert!(x.is_empty())` reads fine
unreadable_literal = "allow"           # hash constants and microsecond values are written the way their sources write them
cast_precision_loss = "allow"          # only sizes, counts and durations become floats, for percentages, speeds and display
# `significant_drop_tightening` is not enabled: it flags every guard that is read in the last expression of a block.

# Debug info is limited to line tables (and none for dependencies): full debug info made the target folder of a sibling project
# grow to more than 100 GB over a day of rebuilds. Dependencies are optimized (Slint, SQLite, the video stack are unusably slow
# otherwise); the own crates build fast at opt-level 1. For a debugger session use `cargo build --profile debug-full`.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.debug-full]
inherits = "dev"
debug = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# `cargo build --profile profiling`, then `samply record target/profiling/rustcut`: release code with symbols.
[profile.profiling]
inherits = "release"
debug = "line-tables-only"
strip = false
